spring.application.name=plataforma-ensino-java

# Server Port
server.port=8085

# Database Configuration (H2 in-memory default for easy dev/test, PostgreSQL configurable via env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:plataforma_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (For development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Desabilita interpretação de ${...} no conteúdo SQL (usado em markdown embarcado)
spring.flyway.placeholder-replacement=false

# JWT Security Config
api.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
api.security.jwt.expiration-ms=86400000

# Sandbox Code Execution Timeout (seconds)
sandbox.execution.timeout-seconds=5
