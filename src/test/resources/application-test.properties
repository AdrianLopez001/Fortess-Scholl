# Configuração de teste — usa H2 em memória
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# JWT para testes
jwt.secret=test-secret-key-for-testing-only-minimum-256-bits-required-here
jwt.expiration=3600000

# Desabilitar Flyway nos testes de contexto (usa H2 DDL direto)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Desabilitar console H2 em teste
spring.h2.console.enabled=false

logging.level.root=WARN
logging.level.com.techsoluctionsrn=INFO
